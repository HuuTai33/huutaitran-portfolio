<app-loader></app-loader>

<main class="web-dev-container">
  <div class="web-dev-content">
    <header class="web-dev-header">
      <h1 class="web-dev-title">Work listing</h1>
    </header>

    <!-- Single Project View (Centered) -->
    <section *ngIf="projects().length === 1" class="projects-single-view" aria-label="Liste des réalisations web">
      <article *ngFor="let project of projects(); trackBy: trackByProject" class="project-card">
        <a
          [href]="project.url"
          target="_blank"
          rel="noopener noreferrer"
          class="project-link"
          [attr.aria-label]="'Visiter le site ' + project.title">
          <div class="project-image-wrapper">
            <img
              [src]="project.image"
              [alt]="'Aperçu du site ' + project.title"
              class="project-image"
              loading="eager"
              fetchpriority="high"
              decoding="async" />
          </div>
          <div class="project-info">
            <h2 class="project-title">{{ project.title }}</h2>
          </div>
        </a>
      </article>
    </section>

    <!-- Multiple Projects Horizontal Infinite Stream View -->
    <section
      *ngIf="projects().length > 1"
      class="projects-stream-viewport"
      aria-label="Liste des réalisations web en défilement infini horizontal"
      (mousedown)="onPointerDown($event)"
      (touchstart)="onTouchStart($event)"
      (touchmove)="onTouchMove($event)"
      (touchend)="onTouchEnd()">
      <div #track class="projects-stream-track">
        <!-- Set 1 (Measured for seamless modulo wrap) -->
        <div #set1 class="projects-loop-set">
          <article *ngFor="let project of projects(); trackBy: trackByProject" class="project-card">
            <a
              [href]="project.url"
              target="_blank"
              rel="noopener noreferrer"
              class="project-link"
              (click)="onLinkClick($event)"
              [attr.aria-label]="'Visiter le site ' + project.title">
              <div class="project-image-wrapper">
                <img
                  [src]="project.image"
                  [alt]="'Aperçu du site ' + project.title"
                  class="project-image"
                  loading="eager"
                  decoding="async" />
              </div>
              <div class="project-info">
                <h2 class="project-title">{{ project.title }}</h2>
              </div>
            </a>
          </article>
        </div>

        <!-- Set 2 (Identical for seamless infinite scroll) -->
        <div class="projects-loop-set" aria-hidden="true">
          <article *ngFor="let project of projects(); trackBy: trackByProject" class="project-card">
            <a
              [href]="project.url"
              target="_blank"
              rel="noopener noreferrer"
              tabindex="-1"
              class="project-link"
              (click)="onLinkClick($event)"
              [attr.aria-label]="'Visiter le site ' + project.title">
              <div class="project-image-wrapper">
                <img
                  [src]="project.image"
                  [alt]="'Aperçu du site ' + project.title"
                  class="project-image"
                  loading="lazy"
                  decoding="async" />
              </div>
              <div class="project-info">
                <h2 class="project-title">{{ project.title }}</h2>
              </div>
            </a>
          </article>
        </div>

        <!-- Set 3 (Identical for seamless infinite scroll on wide screens) -->
        <div class="projects-loop-set" aria-hidden="true">
          <article *ngFor="let project of projects(); trackBy: trackByProject" class="project-card">
            <a
              [href]="project.url"
              target="_blank"
              rel="noopener noreferrer"
              tabindex="-1"
              class="project-link"
              (click)="onLinkClick($event)"
              [attr.aria-label]="'Visiter le site ' + project.title">
              <div class="project-image-wrapper">
                <img
                  [src]="project.image"
                  [alt]="'Aperçu du site ' + project.title"
                  class="project-image"
                  loading="lazy"
                  decoding="async" />
              </div>
              <div class="project-info">
                <h2 class="project-title">{{ project.title }}</h2>
              </div>
            </a>
          </article>
        </div>

        <!-- Set 4 (Ensures continuous coverage even for 2 items on ultra-wide screens) -->
        <div class="projects-loop-set" aria-hidden="true">
          <article *ngFor="let project of projects(); trackBy: trackByProject" class="project-card">
            <a
              [href]="project.url"
              target="_blank"
              rel="noopener noreferrer"
              tabindex="-1"
              class="project-link"
              (click)="onLinkClick($event)"
              [attr.aria-label]="'Visiter le site ' + project.title">
              <div class="project-image-wrapper">
                <img
                  [src]="project.image"
                  [alt]="'Aperçu du site ' + project.title"
                  class="project-image"
                  loading="lazy"
                  decoding="async" />
              </div>
              <div class="project-info">
                <h2 class="project-title">{{ project.title }}</h2>
              </div>
            </a>
          </article>
        </div>
      </div>
    </section>
  </div>

  <!-- Bottom Floating Minimal Footer -->
  <aside class="stream-floating-hud" aria-label="Pied de page">
    <div class="hud-left">
      <a href="mailto:huutai.tran33@gmail.com" class="hud-email">EMAIL : huutai.tran33@gmail.com</a>
    </div>

    <div class="hud-right">
      <span class="hud-year">©2026</span>
    </div>
  </aside>
</main>
