<div 
  *ngIf="photosService.isLightboxOpen() && photosService.activePhoto() as photo" 
  class="lightbox-backdrop"
  (click)="close()"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="t().lightbox.ariaLightbox">

  <!-- Close Button -->
  <button 
    type="button" 
    class="lightbox-close-btn" 
    (click)="close()"
    [attr.aria-label]="t().lightbox.close"
    [attr.title]="t().lightbox.closeEsc">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>

  <!-- Centered Single Photo Container -->
  <div class="lightbox-photo-container" (click)="$event.stopPropagation()">
    <img 
      [src]="photo" 
      [alt]="t().lightbox.altPhoto"
      class="lightbox-photo-img" />

    <div class="lightbox-inquiry-box">
      <p class="lightbox-inquiry-text">
        <span>{{ t().lightbox.printInquiryTitle }}</span>
        <br />
        <span>{{ t().lightbox.printInquirySubtitle }}</span>
      </p>
      <a href="mailto:huutai.tran33@gmail.com" class="btn-direct-contact">
        <span>{{ t().lightbox.contactCta }}</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    </div>
  </div>
</div>
