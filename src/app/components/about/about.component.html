@if (photosService.isAboutOpen()) {
<div
  class="about-modal-backdrop"
  animate.leave="is-leaving"
  (click)="close()">

  <div class="about-modal-container" (click)="$event.stopPropagation()">
    <!-- Header with Close Button -->
    <header class="about-modal-header">
      <button
        type="button"
        class="about-close-btn"
        (click)="close()"
        [attr.aria-label]="t().about.close"
        [attr.title]="t().about.closeEsc">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <div class="about-modal-body">
      <h2 class="artist-name">{{ t().about.roleTitle }}</h2>

      <div class="about-bio">
        <p>
          {{ t().about.bio1 }}
        </p>
        <p>
          {{ t().about.bio2 }}
        </p>
        <p>
          {{ t().about.bio3 }}
        </p>
      </div>

      <h2 class="artist-name">{{ t().about.workTogetherTitle }}</h2>

      <div class="about-bio">
        <p>
          {{ t().about.workTogetherBio1 }}
        </p>
        <p>
          {{ t().about.workTogetherBio2 }}
        </p>
      </div>

      <div class="about-contact-cta">
        <a href="mailto:huutai.tran33@gmail.com" class="btn-direct-contact">
          <span>{{ t().about.contactCta }}</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>
      </div>
    </div>
  </div>
</div>
}
