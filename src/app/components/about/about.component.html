<div 
  *ngIf="photosService.isAboutOpen()" 
  class="about-modal-backdrop"
  (click)="close()">
  
  <div class="about-modal-container" (click)="$event.stopPropagation()">
    <!-- Header with Close Button -->
    <header class="about-modal-header">
      <button 
        type="button" 
        class="about-close-btn"
        (click)="close()"
        aria-label="Fermer"
        title="Fermer (Échap)">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <div class="about-modal-body">
      <h2 class="artist-name">HuuTai Tran</h2>

      <div class="about-contact-cta">
        <a href="mailto:huutai.tran33@gmail.com" class="btn-direct-contact">
          <span>Prendre contact / Commande de tirage</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>
      </div>
    </div>
  </div>
</div>
