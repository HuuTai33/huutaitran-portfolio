<header
  class="fixed top-0 left-0 w-full z-50 transition-all duration-300"
  [class.glass-nav]="isScrolled() && !isMobileMenuOpen()"
  [class.nav-transparent]="!isScrolled() || isMobileMenuOpen()"
  [class.menu-open]="isMobileMenuOpen()">

  <div class="header-container">
    <!-- Brand Logo (Left) -->
    <a routerLink="/" (click)="closeMobileMenu()" class="brand-link" [attr.aria-label]="t().nav.ariaHome">
      <span class="brand-title">HuuTai Tran</span>
    </a>

    <div class="header-actions">
    <!-- Desktop Navigation (Right) -->
    <nav class="nav-links" [attr.aria-label]="t().nav.ariaNav">
      <div class="lang-selector" aria-label="Langue / Language">
        <button
          type="button"
          class="lang-btn"
          [class.active]="currentLang() === 'FR'"
          (click)="setLanguage('FR')"
          aria-label="Français">
          FR
        </button>
        <span class="lang-separator" aria-hidden="true">|</span>
        <button
          type="button"
          class="lang-btn"
          [class.active]="currentLang() === 'EN'"
          (click)="setLanguage('EN')"
          aria-label="English">
          EN
        </button>
      </div>
      <a
        href="#about"
        (click)="openAbout($event)"
        class="nav-item">
        {{ t().nav.about }}
      </a>
      <a
        routerLink="/shop"
        class="nav-item"
        [class.active]="isShopPage()">
        {{ t().nav.shop }}
      </a>
      <a
        href="https://www.instagram.com/trn.ht"
        target="_blank"
        rel="noopener noreferrer"
        class="nav-item">
        {{ t().nav.instagram }}
      </a>
      <a
        *ngIf="showPhotography()"
        routerLink="/photography"
        class="nav-item">
        {{ t().nav.photography }}
      </a>
      <a
        *ngIf="showWebDevelopment()"
        routerLink="/web_development"
        class="nav-item">
        {{ t().nav.webDevelopment }}
      </a>
    </nav>

    <!-- Cart shortcut (visible once at least one item is in the cart) -->
    @if (cartCount() > 0) {
      <a
        routerLink="/shop/cart"
        (click)="closeMobileMenu()"
        class="cart-link"
        [attr.aria-label]="t().nav.ariaCart + ' (' + cartCount() + ')'">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span class="cart-badge" aria-hidden="true">{{ cartCount() }}</span>
      </a>
    }

    <!-- Mobile Hamburger Toggle -->
    <button
      type="button"
      (click)="toggleMobileMenu()"
      class="mobile-toggle"
      [attr.aria-expanded]="isMobileMenuOpen()"
      [attr.aria-label]="t().nav.ariaMenu">
      <span
        class="toggle-bar"
        [class.rotate-top]="isMobileMenuOpen()"></span>
      <span
        class="toggle-bar"
        [class.hide-mid]="isMobileMenuOpen()"></span>
      <span
        class="toggle-bar"
        [class.rotate-bot]="isMobileMenuOpen()"></span>
    </button>
    </div>
  </div>

  <!-- Mobile Drawer Menu -->
  <div
    *ngIf="isMobileMenuOpen()"
    animate.leave="drawer-leaving"
    class="mobile-drawer">

    <div class="drawer-links">
      <div class="drawer-lang-selector" aria-label="Langue / Language">
        <button
          type="button"
          class="drawer-lang-btn"
          [class.active]="currentLang() === 'FR'"
          (click)="setLanguage('FR')"
          aria-label="Français">
          FR
        </button>
        <span class="drawer-lang-separator" aria-hidden="true">|</span>
        <button
          type="button"
          class="drawer-lang-btn"
          [class.active]="currentLang() === 'EN'"
          (click)="setLanguage('EN')"
          aria-label="English">
          EN
        </button>
      </div>
      <a
        href="#about"
        (click)="openAbout($event)"
        class="drawer-item">
        {{ t().nav.about }}
      </a>
      <a
        routerLink="/shop"
        (click)="closeMobileMenu()"
        class="drawer-item">
        {{ t().nav.shop }}
      </a>
      <a
        href="https://www.instagram.com/trn.ht"
        target="_blank"
        rel="noopener noreferrer"
        (click)="closeMobileMenu()"
        class="drawer-item">
        {{ t().nav.instagram }}
      </a>
      <a
        *ngIf="showPhotography()"
        routerLink="/photography"
        (click)="closeMobileMenu()"
        class="drawer-item">
        {{ t().nav.photography }}
      </a>
      <a
        *ngIf="showWebDevelopment()"
        routerLink="/web_development"
        (click)="closeMobileMenu()"
        class="drawer-item">
        {{ t().nav.webDevelopment }}
      </a>
    </div>
  </div>
</header>
