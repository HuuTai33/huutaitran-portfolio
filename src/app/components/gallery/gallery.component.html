<section
  class="gallery-viewport"
  aria-label="Galerie photographique en défilement infini et parallaxe"
  (mousedown)="onPointerDown($event)"
  (touchstart)="onTouchStart($event)"
  (touchmove)="onTouchMove($event)"
  (touchend)="onTouchEnd()">

  <!-- Alternating Parallax Infinite Stream -->
  <div class="stream-columns-track">

    <!-- Left Column (Odd photos) -->
    <div #colLeft class="stream-column col-left">
      <!-- Cycle Set 1 (Measured for seamless modulo wrap) -->
      <div #colLeftSet class="column-loop-set">
        <article
          *ngFor="let photo of leftColumnPhotos(); let i = index; trackBy: trackByPhoto"
          class="photo-item"
          (click)="openPhoto(photo)"
          tabindex="0"
          (keydown.enter)="openPhoto(photo)"
          aria-label="Agrandir la photo">
          <div class="photo-img-box">
            <img
              [src]="photo"
              alt="Photographie"
              [loading]="i < 2 ? 'eager' : 'lazy'"
              [attr.fetchpriority]="i === 0 ? 'high' : null"
              decoding="async"
              (load)="onImageLoaded()"
              class="photo-img" />
          </div>
        </article>
      </div>

      <!-- Cycle Set 2 (Identical for seamless infinite scroll) -->
      <div class="column-loop-set" aria-hidden="true">
        <article
          *ngFor="let photo of leftColumnPhotos(); trackBy: trackByPhoto"
          class="photo-item"
          (click)="openPhoto(photo)"
          tabindex="0"
          (keydown.enter)="openPhoto(photo)">
          <div class="photo-img-box">
            <img
              [src]="photo"
              alt="Photographie"
              loading="lazy"
              decoding="async"
              (load)="onImageLoaded()"
              class="photo-img" />
          </div>
        </article>
      </div>
    </div>

    <!-- Right Column (Even photos) -->
    <div #colRight class="stream-column col-right">
      <!-- Cycle Set 1 (Measured for seamless modulo wrap) -->
      <div #colRightSet class="column-loop-set">
        <article
          *ngFor="let photo of rightColumnPhotos(); let i = index; trackBy: trackByPhoto"
          class="photo-item"
          (click)="openPhoto(photo)"
          tabindex="0"
          (keydown.enter)="openPhoto(photo)"
          aria-label="Agrandir la photo">
          <div class="photo-img-box">
            <img
              [src]="photo"
              alt="Photographie"
              [loading]="i < 2 ? 'eager' : 'lazy'"
              [attr.fetchpriority]="i === 0 ? 'high' : null"
              decoding="async"
              (load)="onImageLoaded()"
              class="photo-img" />
          </div>
        </article>
      </div>

      <!-- Cycle Set 2 (Identical for seamless infinite scroll) -->
      <div class="column-loop-set" aria-hidden="true">
        <article
          *ngFor="let photo of rightColumnPhotos(); trackBy: trackByPhoto"
          class="photo-item"
          (click)="openPhoto(photo)"
          tabindex="0"
          (keydown.enter)="openPhoto(photo)">
          <div class="photo-img-box">
            <img
              [src]="photo"
              alt="Photographie"
              loading="lazy"
              decoding="async"
              (load)="onImageLoaded()"
              class="photo-img" />
          </div>
        </article>
      </div>
    </div>

  </div>

  <!-- Bottom Floating Minimal Footer -->
  <aside class="stream-floating-hud" aria-label="Pied de page">
    <div class="hud-left">
      <a href="mailto:huutai.tran33@gmail.com" class="hud-email">EMAIL : huutai.tran33@gmail.com</a>
    </div>

    <div class="hud-right">
      <span class="hud-year">©2026</span>
    </div>
  </aside>

</section>
