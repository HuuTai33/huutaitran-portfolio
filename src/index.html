<!doctype html>
<html lang="fr" class="dark">
<head>
  <meta charset="utf-8">
  <title>HuuTai Tran</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio de HuuTai Tran.">
  <meta name="keywords" content="HuuTai Tran, photographe, street photography, fine art, Fujifilm, portfolio">
  <meta name="author" content="HuuTai Tran">
  <!-- Favicon / App Icons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="shortcut icon" href="favicon.ico">

  <!-- Preconnect Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    @keyframes dotBounce {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.3;
      }
      40% {
        transform: translateY(-10px);
        opacity: 1;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
      }
    }
  </style>
</head>
<body class="bg-[#0b0c0e] text-[#f4f4f6] selection:bg-white selection:text-black">
  <app-root>
    <div style="position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background-color:#0a0a0c;user-select:none;">
      <div style="display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:clamp(2.2rem, 5vw, 3.25rem);font-weight:300;color:#f5f5f7;letter-spacing:0.08em;">
        <span style="color:rgba(255,255,255,0.6);font-weight:300;">&#123;</span>
        <span style="display:inline-flex;align-items:baseline;padding:0 0.18em;gap:0.12em;">
          <span style="display:inline-block;color:#ffffff;font-weight:700;line-height:1;animation:dotBounce 1.25s infinite ease-in-out both;">.</span>
          <span style="display:inline-block;color:#ffffff;font-weight:700;line-height:1;animation:dotBounce 1.25s infinite ease-in-out both 0.18s;">.</span>
          <span style="display:inline-block;color:#ffffff;font-weight:700;line-height:1;animation:dotBounce 1.25s infinite ease-in-out both 0.36s;">.</span>
        </span>
        <span style="color:rgba(255,255,255,0.6);font-weight:300;">&#125;</span>
      </div>
    </div>
  </app-root>
</body>
</html>
